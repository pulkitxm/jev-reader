<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jev Reader</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><strong>Jev Reader</strong><button id="settings-toggle" class="secondary" aria-label="API key settings" aria-expanded="false">API key</button></header>
<main>
<section id="reader">
<button id="analyze" class="primary">Analyze</button>
<section id="activity" hidden aria-label="Analysis progress">
<div class="activity-heading"><strong id="phase" role="status" aria-live="polite"></strong><span id="elapsed" aria-label="Elapsed time"></span></div>
<progress id="section-progress" max="100" value="0" aria-label="Sections completed"></progress>
<div id="metrics"><span id="section-count"></span><span id="checked-count"></span><span id="explained-count"></span></div>
<div id="loading-preview" aria-hidden="true"><i class="skeleton short"></i><i class="skeleton"></i><i class="skeleton medium"></i></div>
<div id="progress" role="status" aria-live="polite"></div>
</section>
<button id="clear" class="secondary" hidden>Clear underlines</button>
</section>
<section id="settings" hidden>
<form id="settings-form">
<label for="api-key">TypeSafe API key</label><div class="key-row"><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste API key"><button id="show-key" type="button" class="secondary" aria-label="Show API key">Show</button></div>
<p id="key-state" class="hint"></p>
<label for="level">Reading level</label><select id="level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option></select>
<div class="actions"><button class="primary" type="submit">Save</button><button id="remove-key" class="secondary" type="button">Remove key</button></div><p id="settings-status" role="status" aria-live="polite"></p>
</form></section>
</main>
<script src="popup.js"></script>
</body></html>
